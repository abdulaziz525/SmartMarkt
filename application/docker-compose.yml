version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - DB_NAME=data/database.sqlite
      # If you need a custom secret for JWT for each client:
      # - JWT_SECRET=your_secure_secret_here
    volumes:
      # This named volume permanently stores the client's SQLite database
      # ensuring data persists even if the container is rebuilt or destroyed.
      - db-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    ports:
      # This exposes the application on port 80 of the host machine.
      # If you run multiple clients on one machine, change the left side (e.g., "8081:80")
      - "80:80"
    volumes:
      # Mount the reverse proxy configuration
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  # Define the named volume for SQLite database persistence
  db-data:
