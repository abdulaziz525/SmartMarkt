definitions:
  error:
    type: object
    required:
      - code
      - message
      - referenceid
    properties:
      code:
        type: string
      message:
        type: string
  fullInfo:
    type: object
    description: |-
      البيانات الأساسية للسجل التجاري
      Commercial Registry Information
      -
    properties:
      crNationalNumber:
        type: string
        description: Commercial Registry National Number - الرقم الموحد للسجل التجاري
      crNumber:
        type: string
        description: Commercial Registry Number - رقم السجل التجاري
      versionNo:
        type: integer
        description: Commercial Registry Version Number  - رقم نسخة السجل التجاري
      name:
        type: string
        description: Full Entity Name - الاسم التجاري للمنشأة
      nameLangId:
        type: integer
        description: Entity Name Language ID - رمز لغة الاسم التجاري
      nameLangDesc:
        type: string
        description: Entity Name Language Description - وصف لغة الاسم التجاري
      crCapital:
        type: number
        description: Capital - راس المال
      companyDuration:
        type: integer
        description: Company Duration - مدة الشركة
      isMain:
        type: boolean
        description: Is Main Commercial Registry - هل السجل التجاري رئيسي
      issueDateGregorian:
        type: string
        description: Commercial Registry Issue Date (Gregorian) - تاريخ اصدار السجل التجاري ميلادي
      issueDateHijri:
        type: string
        description: Commercial Registry Issue Date (Hijri) - تاريخ اصدار السجل التجاري هجري
      mainCrNationalNumber:
        type: string
        description: Main Commercial Registry National Number - الرقم الموحد للسجل الرئيسي
      mainCrNumber:
        type: string
        description: Main Commercial Registry Number - رقم السجل التجاري الرئيسي
      inLiquidationProcess:
        type: boolean
        description: In Liquidation Process - هل الشركة جاري تصفيتها
      hasEcommerce:
        type: boolean
        description: Has Ecommerce - هل تمارس التجارة الإلكترونية
      headquarterCityId:
        type: integer
        description: Headquarter City ID - رمز مدينة المقر الرئيسي للشركة
      headquarterCityName:
        type: string
        description: Headquarter City Name - وصف مدينة المقر الرئيسي للشركة
      isLicenseBased:
        type: boolean
        description: Is License-Based - هل السجل مصدر بناء على ترخيص
      licenseIssuerNationalNumber:
        type: string
        description: License Issuer National Number - الرقم الموحد لجهة إصدار الترخيص
      licenseIssuerName:
        type: string
        description: License Issuer Description - وصف جهة إصدار الترخيص
      partnersNationalityId:
        type: integer
        description: Partners Nationality ID - رمز جنسية الشركاء
      PartnersNationalityName:
        type: string
        description: Partners Nationality Description - وصف جنسية الشركاء
      entityType:
        type: object
        required:
          - id
          - name
        properties:
